  <section class="schedule-board" aria-label="日程记录">
    <div class="schedule-board-head">
      <h2 class="schedule-month-title" data-schedule-month></h2>
      <div class="schedule-controls">
        <button type="button" data-schedule-prev aria-label="上个月"><i class="fa fa-angle-left" aria-hidden="true"></i></button>

    </div>

    <div class="schedule-legend" aria-label="节日标识说明">
      <span class="is-legal"><i></i>法定节日</span>
      <span class="is-traditional"><i></i>传统节日</span>
      <span class="is-special"><i></i>特别纪念日</span>
    </div>

    <div class="schedule-calendar" role="grid" aria-label="月历">

        </div>
        <span class="schedule-detail-count" data-schedule-count></span>
      </div>
      <div class="schedule-task-list" data-schedule-tasks></div>

        <select data-schedule-project-select aria-label="选择任务所属大任务"></select>
      </label>
      <form class="schedule-add-task" data-schedule-form>
        <input type="text" maxlength="48" placeholder="添加一项小成就" aria-label="添加日程事项" required>
        <button type="submit" aria-label="添加事项"><i class="fa fa-plus" aria-hidden="true"></i></button>
      </form>
    </div>

    <div class="schedule-summary" aria-label="本月概览">
      <div><i class="far fa-calendar-check" aria-hidden="true"></i><span>完成天数</span><strong data-schedule-completed-days>0</strong></div>
      <div><i class="fa fa-list-check" aria-hidden="true"></i><span>完成事项</span><strong data-schedule-completed-tasks>0</strong></div>
      <div><i class="fa fa-fire" aria-hidden="true"></i><span>连续记录</span><strong data-schedule-streak>0 天</strong></div>
    </div>
  </section>

  <section class="task-constellation" aria-labelledby="constellation-title">
    <div class="constellation-heading">
      <div>
        <span>Task Constellation</span>
        <h2 id="constellation-title">任务星阵图</h2>
        <p>任务、日期与完成状态实时同步</p>
      </div>
      <div class="constellation-progress"><strong data-constellation-progress>0%</strong><span>大任务完成进度</span></div>
    </div>
    <div class="constellation-project-toolbar">
      <label>
        <span>查看大任务</span>
        <select data-constellation-project aria-label="选择星阵大任务"></select>
      </label>
      <form data-schedule-project-form>
        <input type="text" maxlength="24" placeholder="新建大任务，例如：毕业设计" aria-label="新建大任务" required>
        <button type="submit"><i class="fa fa-plus" aria-hidden="true"></i>新建大任务</button>
      </form>
    </div>
    <div class="constellation-layout">
      <div class="constellation-stage" data-constellation-stage aria-label="任务星阵图">
        <svg class="constellation-lines" data-constellation-lines aria-hidden="true" viewBox="0 0 100 100" preserveAspectRatio="none"></svg>
        <div class="constellation-node-layer" data-constellation-nodes></div>
        <div class="constellation-core" aria-hidden="true"><i class="fa fa-star"></i><span data-constellation-core>本月任务</span></div>
      </div>
      <aside class="constellation-detail" data-constellation-detail aria-live="polite"></aside>
    </div>
  </section>

<script>
  window.addEventListener('tabs:register', () => {
    let { activeClass } = CONFIG.comments;
    if (CONFIG.comments.storage) {
      activeClass = localStorage.getItem('comments_active') || activeClass;
    }
    if (activeClass) {
      let activeTab = document.querySelector(`a[href="#comment-${activeClass}"]`);
      if (activeTab) {
        activeTab.click();
      }
    }
  });
  if (CONFIG.comments.storage) {
    window.addEventListener('tabs:click', event => {
      if (!event.target.matches('.tabs-comment .tab-content .tab-pane')) return;
      let commentClass = event.target.classList[1];
      localStorage.setItem('comments_active', commentClass);
    });
  }
</script>

<script>
  (function() {
    var overlay = document.createElement('div');
    overlay.className = 'page-transition-overlay';
    document.body.appendChild(overlay);

    document.addEventListener('click', function(e) {
      var link = e.target.closest('a');
      if (!link || !link.href) return;
      if (link.target === '_blank') return;
      if (link.host !== window.location.host) return;
      if (link.getAttribute('download') != null) return;
      if (link.hash && link.pathname === window.location.pathname) return;
      if (e.metaKey || e.ctrlKey) return;

      e.preventDefault();
      document.body.classList.add('page-exiting');
      setTimeout(function() {
        window.location = link.href;
      }, 260);
    });

    // Keep overlay hidden when navigating back via bfcache.
    window.addEventListener('pageshow', function(e) {
      document.body.classList.remove('page-exiting');
    });
  })();
</script>
